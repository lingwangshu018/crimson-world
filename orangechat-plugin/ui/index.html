<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>绯界</title>
  <style>
    :root {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f6eadf;
      background: #12090d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px 16px 36px;
      background:
        radial-gradient(circle at top, rgba(112, 33, 52, .34), transparent 42%),
        linear-gradient(180deg, #1a0c12, #0b0508);
    }
    main { max-width: 430px; margin: 0 auto; }
    .card {
      padding: 22px;
      border: 1px solid rgba(224, 190, 164, .22);
      border-radius: 22px;
      background: rgba(30, 13, 20, .78);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .3);
      backdrop-filter: blur(14px);
    }
    h1 { margin: 0 0 8px; font-size: 26px; }
    .sub { margin: 0 0 20px; color: #cfb9ad; line-height: 1.7; }
    .status {
      margin: 16px 0;
      padding: 13px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .055);
      color: #e8d8ce;
      line-height: 1.6;
    }
    .ok { color: #c9e7cf; }
    .warn { color: #f2d4a7; }
    a {
      display: block;
      padding: 14px 16px;
      border-radius: 14px;
      text-align: center;
      text-decoration: none;
      font-weight: 700;
      color: #fff7f0;
      background: linear-gradient(135deg, #8f2947, #5b1830);
      box-shadow: 0 12px 34px rgba(99, 20, 45, .34);
    }
    ol { padding-left: 22px; color: #dbc8bc; line-height: 1.8; }
    code { color: #f3cfda; }
    .tiny { margin-top: 18px; color: #9f8980; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>🌹 绯界</h1>
      <p class="sub">让橘瓣 AI 读取指定记录，并把完成后的完整回复准确写回同一条记录。</p>
      <div id="status" class="status">正在检查插件配置……</div>
      <a href="https://lingwangshu018.github.io/crimson-world/" target="_blank" rel="noreferrer">打开绯界网页</a>
      <ol>
        <li>在绯界同步最新记录，并复制读取钥匙与回复钥匙。</li>
        <li>把钥匙填入插件设置并点击“保存配置”，或直接保留在发送给 AI 的任务单里。</li>
        <li>发送任务单后，AI 会先调用 <code>read_crimson_record</code>，完成内容后再调用 <code>write_crimson_reply</code>。</li>
      </ol>
      <p class="tiny">插件不会创建新记录；回复工具只会向指定记录的 note 字段追加内容。</p>
    </section>
  </main>
  <script>
    var attempts = 0;
    function mask(value) {
      value = String(value || "").replace(/\s+/g, "");
      return value ? value.slice(0, 10) + "••••" + value.slice(-5) : "未填写";
    }
    function render(cfg) {
      var readKey = cfg && cfg.read_key;
      var replyKey = cfg && cfg.reply_key;
      var ready = Boolean(readKey && replyKey);
      var status = document.getElementById("status");
      status.className = "status " + (ready ? "ok" : "warn");
      status.innerHTML = ready
        ? "配置已就绪。<br>读取钥匙：" + mask(readKey) + "<br>回复钥匙：" + mask(replyKey)
        : "插件可以安装使用，但设置中尚未同时填写两把钥匙。任务单中携带钥匙时仍可调用。";
    }
    async function init() {
      try {
        var raw = await Bridge.getPluginConfig();
        render(typeof raw === "string" ? JSON.parse(raw) : raw);
      } catch (error) {
        render({});
      }
    }
    function waitForBridge() {
      attempts += 1;
      if (typeof Bridge !== "undefined" && Bridge.getPluginConfig) {
        init();
      } else if (attempts < 80) {
        setTimeout(waitForBridge, 50);
      } else {
        render({});
      }
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", waitForBridge);
    } else {
      waitForBridge();
    }
  </script>
</body>
</html>
