<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">绯界</title>
  <desc id="desc">深绯色圆章，中央为金色绯字</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#7a1837"/>
      <stop offset="52%" stop-color="#4a0d22"/>
      <stop offset="100%" stop-color="#18050b"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b3"/>
      <stop offset="45%" stop-color="#e8c878"/>
      <stop offset="100%" stop-color="#a96b2f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="#0d0306"/>
  <circle cx="256" cy="256" r="188" fill="url(#bg)" stroke="url(#gold)" stroke-width="10" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#f1d48a" stroke-opacity="0.28" stroke-width="3"/>
  <text x="256" y="306" text-anchor="middle" font-size="188" font-family="STKaiti, KaiTi, 'Noto Serif CJK SC', serif" font-weight="600" fill="url(#gold)">绯</text>
</svg>
